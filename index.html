<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Заказов ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            animation: slideUp 0.6s ease-out;
        }

        .card h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="datetime-local"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .orders-list {
            margin-top: 20px;
        }

        .order-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in;
        }

        .order-item h3 {
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .order-item p {
            margin: 5px 0;
            opacity: 0.95;
        }

        .order-item button {
            background: rgba(255,255,255,0.3);
            margin-top: 10px;
            padding: 8px 20px;
            font-size: 0.9rem;
        }

        .order-item button:hover {
            background: rgba(255,255,255,0.4);
        }

        .calculator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .calc-result {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #555;
            margin-top: 15px;
        }

        .status-section textarea {
            min-height: 100px;
            resize: vertical;
        }

        .status-preview {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            white-space: pre-wrap;
            color: #555;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .calculator {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Трекер Заказов ✨</h1>
            <p>Управляй своими заказами легко и красиво</p>
        </div>

        <!-- Секция 1: Добавление заказа -->
        <div class="card">
            <h2>💝 Новый Заказ</h2>
            <div class="form-group">
                <label>Имя аккаунта</label>
                <input type="text" id="accountName" placeholder="Введите имя аккаунта">
            </div>
            <div class="form-group">
                <label>Номер заказа</label>
                <input type="text" id="orderNumber" placeholder="Введите номер заказа">
            </div>
            <div class="form-group">
                <label>Имя покупателя</label>
                <input type="text" id="customerName" placeholder="Введите имя покупателя">
            </div>
            <div class="form-group">
                <label>Время заказа</label>
                <input type="datetime-local" id="orderTime">
            </div>
            <div class="form-group">
                <label>Дата и время окончания заказа</label>
                <input type="datetime-local" id="orderEndTime">
            </div>
            <button onclick="addOrder()">Добавить заказ</button>

            <div class="orders-list" id="ordersList"></div>
        </div>

        <!-- Секция 2: Калькулятор времени -->
        <div class="card">
            <h2>⏰ Калькулятор Времени</h2>
            <div class="calculator">
                <div class="form-group">
                    <label>Время 1</label>
                    <input type="datetime-local" id="time1">
                </div>
                <div class="form-group">
                    <label>Время 2</label>
                    <input type="datetime-local" id="time2">
                </div>
                <div class="form-group">
                    <label>Дополнительные дни</label>
                    <input type="number" id="addDays" placeholder="0" value="0">
                </div>
                <div class="form-group">
                    <label>Дополнительные часы</label>
                    <input type="number" id="addHours" placeholder="0" value="0">
                </div>
                <div class="form-group">
                    <label>Дополнительные минуты</label>
                    <input type="number" id="addMinutes" placeholder="0" value="0">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="calculateDifference()">Разница времени</button>
                <button onclick="calculateSum()">Сложить время</button>
            </div>
            <div class="calc-result" id="calcResult">Выберите операцию для расчета</div>
        </div>

        <!-- Секция 3: Статус покупателя -->
        <div class="card status-section">
            <h2>📨 Статус Покупателя</h2>
            <div class="form-group">
                <label>Имя покупателя</label>
                <input type="text" id="statusCustomerName" placeholder="Введите имя покупателя">
            </div>
            <div class="form-group">
                <label>Статус покупателя</label>
                <textarea id="statusMessage" placeholder="Напишите статус..."></textarea>
            </div>
            <button onclick="saveStatus()">Сохранить статус</button>
            <div class="status-preview" id="statusPreview"></div>
        </div>
    </div>

    <script>
        // Инициализация
        let orders = [];
        let isLoading = false;

        // Загрузка данных при старте
        async function loadData() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                const ordersData = await window.storage.get('orders-data', true);
                if (ordersData && ordersData.value) {
                    orders = JSON.parse(ordersData.value);
                    console.log('Загружено заказов:', orders.length);
                    renderOrders();
                }
            } catch (error) {
                console.log('Загрузка заказов: данные еще не сохранены', error);
                orders = [];
            } finally {
                isLoading = false;
            }
        }

        // Добавление заказа
        async function addOrder() {
            const accountName = document.getElementById('accountName').value;
            const orderNumber = document.getElementById('orderNumber').value;
            const customerName = document.getElementById('customerName').value;
            const orderTime = document.getElementById('orderTime').value;
            const orderEndTime = document.getElementById('orderEndTime').value;

            if (!accountName || !orderNumber || !customerName || !orderTime || !orderEndTime) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            const order = {
                id: Date.now(),
                accountName,
                orderNumber,
                customerName,
                orderTime,
                orderEndTime
            };

            orders.push(order);
            await saveOrders();
            renderOrders();

            // Очистка формы
            document.getElementById('accountName').value = '';
            document.getElementById('orderNumber').value = '';
            document.getElementById('customerName').value = '';
            document.getElementById('orderTime').value = '';
            document.getElementById('orderEndTime').value = '';
        }

        // Сохранение заказов
        async function saveOrders() {
            try {
                const result = await window.storage.set('orders-data', JSON.stringify(orders), true);
                if (result) {
                    console.log('Заказы успешно сохранены:', orders.length);
                } else {
                    console.error('Ошибка сохранения заказов');
                    alert('Ошибка при сохранении данных. Попробуйте еще раз.');
                }
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                alert('Ошибка при сохранении данных: ' + error.message);
            }
        }

        // Отображение заказов
        function renderOrders() {
            const ordersList = document.getElementById('ordersList');
            if (orders.length === 0) {
                ordersList.innerHTML = '';
                return;
            }

            ordersList.innerHTML = orders.map(order => `
                <div class="order-item">
                    <h3>🛍️ Заказ #${order.orderNumber}</h3>
                    <p><strong>Аккаунт:</strong> ${order.accountName}</p>
                    <p><strong>Покупатель:</strong> ${order.customerName}</p>
                    <p><strong>Начало:</strong> ${new Date(order.orderTime).toLocaleString('ru-RU')}</p>
                    <p><strong>Окончание:</strong> ${new Date(order.orderEndTime).toLocaleString('ru-RU')}</p>
                    <button onclick="deleteOrder(${order.id})">Удалить</button>
                </div>
            `).join('');
        }

        // Удаление заказа
        async function deleteOrder(id) {
            orders = orders.filter(order => order.id !== id);
            await saveOrders();
            renderOrders();
        }

        // Калькулятор времени - разница
        function calculateDifference() {
            const time1 = document.getElementById('time1').value;
            const time2 = document.getElementById('time2').value;

            if (!time1 || !time2) {
                document.getElementById('calcResult').textContent = 'Пожалуйста, выберите оба времени!';
                return;
            }

            const start = new Date(time1);
            const end = new Date(time2);
            const diff = Math.abs(end - start);

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            let result = '⏱️ Разница: ';
            if (days > 0) result += `${days} дн. `;
            if (hours > 0) result += `${hours} ч. `;
            result += `${minutes} мин.`;

            document.getElementById('calcResult').textContent = result;
        }

        // Калькулятор времени - сложение
        function calculateSum() {
            const time1 = document.getElementById('time1').value;
            const addDays = parseInt(document.getElementById('addDays').value) || 0;
            const addHours = parseInt(document.getElementById('addHours').value) || 0;
            const addMinutes = parseInt(document.getElementById('addMinutes').value) || 0;

            if (!time1) {
                document.getElementById('calcResult').textContent = 'Пожалуйста, выберите начальное время (Время 1)!';
                return;
            }

            const start = new Date(time1);
            
            // Добавляем время
            start.setDate(start.getDate() + addDays);
            start.setHours(start.getHours() + addHours);
            start.setMinutes(start.getMinutes() + addMinutes);

            const result = `✨ Результат: ${start.toLocaleString('ru-RU')}`;
            document.getElementById('calcResult').textContent = result;
        }

        // Сохранение статуса
        async function saveStatus() {
            const customerName = document.getElementById('statusCustomerName').value;
            const statusMessage = document.getElementById('statusMessage').value;

            if (!customerName || !statusMessage) {
                alert('Пожалуйста, заполните оба поля!');
                return;
            }

            const statusText = `Покупатель: ${customerName}\n\nСтатус:\n${statusMessage}\n\nДата: ${new Date().toLocaleString('ru-RU')}`;
            
            document.getElementById('statusPreview').textContent = statusText;

            try {
                const result = await window.storage.set('customer-status', JSON.stringify({
                    customerName,
                    statusMessage,
                    timestamp: new Date().toISOString()
                }), true);
                
                if (result) {
                    console.log('Статус успешно сохранен');
                } else {
                    console.error('Ошибка сохранения статуса');
                }
            } catch (error) {
                console.error('Ошибка сохранения статуса:', error);
            }
        }

        // Загрузка при старте страницы
        window.addEventListener('load', function() {
            loadData();
        });
    </script>
</body>
</html>
