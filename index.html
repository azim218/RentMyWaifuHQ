      * {
        font-family: 'Baloo 2', 'Quicksand', cursive, sans-serif !important;
      }
      
      .pacifico {
        font-family: 'Pacifico', cursive !important;
      }
      
      body {
        overflow-x: hidden;
        background: linear-gradient(135deg, #ffeef8 0%, #ffe5f5 25%, #f3e5ff 50%, #e5f0ff 75%, #fff0f5 100%);
        background-attachment: fixed;
      }
      
      .cute-shadow {
        box-shadow: 0 20px 60px rgba(236, 72, 153, 0.35), 0 0 0 3px rgba(236, 72, 153, 0.15),
                    inset 0 2px 0 rgba(255, 255, 255, 0.9);
      }
      
      .cute-glow {
        box-shadow: 0 0 50px rgba(236, 72, 153, 0.7), 0 0 100px rgba(168, 85, 247, 0.5),
                    0 0 150px rgba(147, 51, 234, 0.3);
        animation: glow-pulse 2s ease-in-out infinite;
      }
      
      @keyframes glow-pulse {
        0%, 100% { 
          box-shadow: 0 0 50px rgba(236, 72, 153, 0.7), 0 0 100px rgba(168, 85, 247, 0.5);
        }
        50% { 
          box-shadow: 0 0 70px rgba(236, 72, 153, 0.9), 0 0 130px rgba(168, 85, 247, 0.7);
        }
      }
      
      .kawaii-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 240, 250, 0.98) 100%);
        border: 5px solid transparent;
        background-clip: padding-box;
        position: relative;
      }
      
      .kawaii-card::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: inherit;
        padding: 5px;
        background: linear-gradient(135deg, #ff6b9d, #c06cff, #6bb6ff, #ff6b9d);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: border-flow 3s linear infinite;
        background-size: 200% 200%;
      }
      
      @keyframes border-flow {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      
      .floating {
        animation: floating 4s ease-in-out infinite;
      }
      
      @keyframes floating {
        0%, 100% { transform: translateY(0px) rotate(-5deg); }
        25% { transform: translateY(-20px) rotate(5deg); }
        50% { transform: translateY(-10px) rotate(-3deg); }
        75% { transform: translateY(-25px) rotate(3deg); }
      }
      
      .sparkle-animation {
        animation: sparkle 2.5s ease-in-out infinite;
      }
      
      @keyframes sparkle {
        0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1); }
        25% { opacity: 0.7; transform: scale(1.5) rotate(90deg); filter: brightness(1.3); }
        50% { opacity: 0.5; transform: scale(1.2) rotate(180deg); filter: brightness(1.5); }
        75% { opacity: 0.8; transform: scale(1.4) rotate(270deg); filter: brightness(1.2); }
      }
      
      .wiggle {
        animation: wiggle 3s ease-in-out infinite;
      }
      
      @keyframes wiggle {
        0%, 100% { transform: rotate(-5deg) scale(1); }
        25% { transform: rotate(5deg) scale(1.05); }
        50% { transform: rotate(-3deg) scale(1.02); }
        75% { transform: rotate(3deg) scale(1.05); }
      }
      
      .pulse-soft {
        animation: pulse-soft 2.5s ease-in-out infinite;
      }
      
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        50% { opacity: 0.85; transform: scale(1.08); filter: brightness(1.2); }
      }
      
      .bounce-cute {
        animation: bounce-cute 1.5s ease-in-out infinite;
      }
      
      @keyframes bounce-cute {
        0%, 100% { transform: translateY(0) scale(1); }
        25% { transform: translateY(-15px) scale(1.1); }
        50% { transform: translateY(-5px) scale(0.95); }
        75% { transform: translateY(-12px) scale(1.05); }
      }
      
      .gradient-text {
        background: linear-gradient(135deg, #ff1493 0%, #ff69b4 25%, #ba55d3 50%, #9370db 75%, #4169e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient-shift 3s ease infinite;
        background-size: 200% 200%;
      }
      
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      
      .rainbow-text {
        background: linear-gradient(90deg, #ff6b9d, #c06cff, #6bb6ff, #6bffc0, #ffd66b, #ff6b9d);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: rainbow 4s ease infinite;
      }
      
      @keyframes rainbow {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      
      .success-ping {
        animation: success-ping 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      
      @keyframes success-ping {
        0% { transform: scale(0.7) rotate(-10deg); opacity: 0; }
        50% { transform: scale(1.15) rotate(5deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      
      .heart-beat {
        animation: heart-beat 1.5s ease-in-out infinite;
      }
      
      @keyframes heart-beat {
        0%, 100% { transform: scale(1); }
        10%, 30% { transform: scale(1.1); }
        20%, 40% { transform: scale(0.95); }
      }
      
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      
      .shimmer::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: shimmer 3s infinite;
      }
      
      @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
      }
      
      .confetti-bg {
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(221, 160, 221, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 40% 70%, rgba(173, 216, 230, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 90% 80%, rgba(255, 192, 203, 0.3) 0%, transparent 50%);
        animation: confetti-move 15s ease-in-out infinite;
      }
      
      @keyframes confetti-move {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(20px, -20px); }
        50% { transform: translate(-20px, 20px); }
        75% { transform: translate(20px, 10px); }
      }
    </style>
</head>

useEffect(() => {
  const interval = setInterval(() => {
    setAccounts(prev => prev.map(acc => {
      const newRemaining = Math.max(0, acc.remaining - 1);
      const wasActive = acc.status === 'active';
      const newStatus = newRemaining === 0 ? 'expired' : 'active';
      
      if (wasActive && newStatus === 'expired') {

          autoKickAccount(acc.id, acc.robloxCookie);
        }
      }
      
      return {
        ...acc,
        remaining: newRemaining,
        status: newStatus
      };
    }));
  }, 60000);
  return () => clearInterval(interval);
}, [serverUrl]);

const autoKickAccount = async (accountId, cookie) => {
  try {
    const response = await fetch(`${serverUrl}/api/logout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie })
    });
    
    const data = await response.json();
    
    if (data.success) {
      setAccounts(prev => prev.map(acc => 
        acc.id === accountId ? { ...acc, status: 'kicked', kickedAuto: true } : acc
      ));
      showNotif(`✨ ${accounts.find(a => a.id === accountId)?.username} автоматически кикнут!`);
    } else {
      setAccounts(prev => prev.map(acc => 
        acc.id === accountId ? { ...acc, status: 'kick-failed' } : acc
      ));
      showNotif(`❌ Ошибка автокика. Нажмите кнопку вручную!`);
    }
  } catch (error) {
    setAccounts(prev => prev.map(acc => 
      acc.id === accountId ? { ...acc, status: 'expired' } : acc
    ));

                    <div className="text-center mb-14">
                      <div className="mb-8 sparkle-animation wiggle">
                        <span className="text-9xl">🌸✨</span>
                      </div>
                      <h1 className="text-7xl font-bold rainbow-text mb-6 pacifico">
                        Roblox Manager
                      </h1>
                      <p className="text-pink-600 text-2xl font-bold">Добро пожаловать, милашка! 💖✨</p>
                      <p className="text-purple-500 text-lg font-semibold mt-2">Синхронизация между устройствами ☁️</p>
                    </div>

                    <div className="space-y-8">
                      <div className="relative">
                        <div className="absolute left-7 top-1/2 -translate-y-1/2 text-3xl sparkle-animation">✨</div>
                        <input
                          type="text"
                          placeholder="Логин"
                          value={username}
                          onChange={(e) => setUsername(e.target.value)}
                          className="w-full pl-20 pr-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-pink-50 to-purple-50 shadow-xl text-xl font-bold"
                        />
                      </div>

                      <div className="relative">
                        <div className="absolute left-7 top-1/2 -translate-y-1/2 text-3xl sparkle-animation" style={{animationDelay: '0.5s'}}>🔒</div>
                        <input
                          type="password"
                          placeholder="Пароль"
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                          className="w-full pl-20 pr-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-pink-50 to-purple-50 shadow-xl text-xl font-bold"
                        />
                      </div>

                      <button
                        onClick={handleLogin}
                        className="w-full py-7 bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white font-bold text-3xl rounded-full shadow-2xl hover:shadow-pink-400/50 transform hover:scale-105 transition-all duration-300 cute-glow shimmer"
                      >
                        Войти ✨💖
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen confetti-bg p-4 md:p-8 relative overflow-hidden">
              {showNotification && (
                <div className="fixed top-8 right-8 z-50 success-ping">
                  <div className="bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 text-white px-10 py-8 rounded-full shadow-2xl cute-glow flex items-center gap-5 border-5 border-white shimmer">
                    <Bell size={32} className="bounce-cute" />
                    <span className="text-2xl font-bold">{notificationText}</span>
                  </div>
                </div>
              )}

              <div className="absolute inset-0 overflow-hidden pointer-events-none">
                <div className="absolute top-10 right-10 text-pink-200 opacity-12 floating wiggle" style={{animationDuration: '5s'}}>
                  <Sparkles size={160} fill="currentColor" />
                </div>
                <div className="absolute bottom-20 left-10 text-purple-200 opacity-12 floating" style={{animationDuration: '6s'}}>
                  <Star size={140} fill="currentColor" />
                </div>
                <div className="absolute top-1/2 left-1/4 text-blue-200 opacity-12 floating wiggle" style={{animationDuration: '7s'}}>
                  <Heart size={130} fill="currentColor" />
                </div>
              </div>

              <div className="max-w-7xl mx-auto relative z-10">
                <div className="kawaii-card rounded-[60px] shadow-2xl cute-shadow p-10 mb-10 shimmer">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                    <div className="text-center md:text-left">
                      <div className="flex items-center gap-5 justify-center md:justify-start mb-4">
                        <Heart className="text-pink-400 pulse-soft heart-beat" fill="currentColor" size={56} />
                        <h1 className="text-6xl md:text-7xl font-bold rainbow-text pacifico">
                          Roblox Manager
                        </h1>
                        <Sparkles className="text-purple-400 sparkle-animation" size={48} />
                      </div>
                      <p className="text-gray-700 text-2xl font-bold flex items-center gap-3 justify-center md:justify-start">
                        <span className="text-3xl">👑</span>
                        Azim218 • Администратор
                        <span className="text-2xl">☁️</span>
                      </p>
                    </div>
                    <button
                      onClick={handleLogout}
                      className="px-12 py-6 bg-gradient-to-r from-red-400 via-pink-400 to-red-500 text-white font-bold rounded-full shadow-2xl hover:shadow-red-400/50 transform hover:scale-110 transition-all duration-300 flex items-center gap-4 text-2xl shimmer"
                    >
                      <LogOut size={32} />
                      Выйти
                    </button>
                  </div>
                </div>

                <div className="flex flex-wrap gap-5 mb-10 justify-center">
                  {[
                    { id: 'accounts', label: 'Аккаунты', Icon: Clock, emoji: '⏰' },
                    { id: 'clients', label: 'Клиенты', Icon: Users, emoji: '👥' },
                    { id: 'calculator', label: 'Калькулятор', Icon: Calculator, emoji: '🧮' },
                    { id: 'profile', label: 'Профиль', Icon: User, emoji: '👤' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setCurrentTab(tab.id)}
                      className={`px-10 py-6 rounded-full font-bold text-2xl transition-all duration-300 transform hover:scale-110 flex items-center gap-4 shadow-2xl shimmer ${
                        currentTab === tab.id
                          ? 'bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 text-white cute-glow scale-110'
                          : 'kawaii-card text-gray-800 hover:bg-pink-50 border-3 border-pink-300'
                      }`}
                    >
                      <span className="text-4xl sparkle-animation">{tab.emoji}</span>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {currentTab === 'accounts' && (
                  <div className="space-y-10">
                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-shadow p-12 shimmer">
                      <h2 className="text-5xl font-bold text-purple-600 mb-12 flex items-center gap-5 pacifico">
                        <span className="text-6xl sparkle-animation">✨</span>
                        <span className="gradient-text">Добавить аккаунт</span>
                        <span className="text-6xl wiggle">💖</span>
                      </h2>
                      <div className="space-y-7">
                        <input
                          type="text"
                          placeholder="💕 Имя покупателя"
                          value={accUsername}
                          onChange={(e) => setAccUsername(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-pink-50 shadow-xl text-2xl font-bold"
                        />
                        <select
                          value={accProfile}
                          onChange={(e) => setAccProfile(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-purple-50 shadow-xl text-2xl font-bold"
                        >
                          <option value="">🎮 Выберите профиль</option>
                          {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                        <input
                          type="number"
                          placeholder="⏰ Минуты аренды"
                          value={accDuration}
                          onChange={(e) => setAccDuration(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-blue-50 shadow-xl text-2xl font-bold"
                        />
                        <input
                          type="text"
                          placeholder="🍪 Roblox Cookie (опционально, для автокика)"
                          value={accRobloxCookie}
                          onChange={(e) => setAccRobloxCookie(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-pink-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-green-50 shadow-xl text-2xl font-bold"
                        />
                        <button
                          onClick={addAccount}
                          className="w-full py-8 bg-gradient-to-r from-green-400 via-emerald-400 to-green-500 text-white font-bold text-3xl rounded-full shadow-2xl hover:shadow-green-400/50 transform hover:scale-105 transition-all duration-300 shimmer"
                        >
                          ✨💖 Добавить аккаунт 💖✨
                        </button>
                      </div>
                    </div>

                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-shadow p-12 shimmer">
                      <h2 className="text-5xl font-bold text-purple-600 mb-12 flex items-center gap-5 pacifico">
                        <Heart className="text-pink-400 pulse-soft heart-beat" fill="currentColor" size={48} />
                        <span className="gradient-text">Активные аккаунты ({accounts.length})</span>
                        <Sparkles className="text-purple-400 sparkle-animation" fill="currentColor" size={44} />
                      </h2>
                      {accounts.length === 0 ? (
                        <div className="text-center py-24">
                          <div className="text-9xl mb-8 sparkle-animation wiggle">🌸✨💖</div>
                          <p className="text-gray-600 text-4xl font-bold gradient-text">Нет активных аккаунтов</p>
                          <p className="text-gray-500 text-xl font-semibold mt-4">Добавьте первый аккаунт выше! ☁️</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                          {accounts.map(acc => {
                            const getStatusInfo = () => {
                              switch(acc.status) {
                                case 'active':
                                  return { 
                                    bg: 'from-pink-100 via-purple-100 to-pink-100', 
                                    border: 'border-pink-400',
                                    badge: 'bg-gradient-to-r from-green-400 to-emerald-500 text-white',
                                    badgeText: 'Активен ✨',
                                    showKick: false,
                                    emoji: '💖'
                                  };
                                case 'expired':
                                  return { 
                                    bg: 'from-orange-100 via-red-100 to-orange-100', 
                                    border: 'border-orange-400',
                                    badge: 'bg-gradient-to-r from-orange-400 to-red-500 text-white',
                                    badgeText: 'Истёк ⏰',
                                    showKick: true,
                                    emoji: '⏰'
                                  };
                                case 'pending-kick':
                                  return { 
                                    bg: 'from-yellow-100 via-orange-100 to-yellow-100', 
                                    border: 'border-yellow-500',
                                    badge: 'bg-gradient-to-r from-yellow-400 to-orange-500 text-white',
                                    badgeText: 'Ожидает 🔄',
                                    showKick: false,
                                    emoji: '🔄'
                                  };
                                case 'kicked':
                                  return { 
                                    bg: 'from-green-100 via-emerald-100 to-green-100', 
                                    border: 'border-green-500',
                                    badge: 'bg-gradient-to-r from-green-500 to-emerald-600 text-white',
                                    badgeText: acc.kickedAuto ? 'Авто-кикнут ✨' : 'Кикнут ✅',
                                    showKick: false,
                                    emoji: '✅'
                                  };
                                case 'kick-failed':
                                  return { 
                                    bg: 'from-red-100 via-pink-100 to-red-100', 
                                    border: 'border-red-500',
                                    badge: 'bg-gradient-to-r from-red-500 to-pink-600 text-white',
                                    badgeText: 'Ошибка ❌',
                                    showKick: true,
                                    emoji: '❌'
                                  };
                                default:
                                  return { 
                                    bg: 'from-gray-100 to-gray-200', 
                                    border: 'border-gray-400',
                                    badge: 'bg-gray-400 text-white',
                                    badgeText: 'Неизвестно',
                                    showKick: false,
                                    emoji: '❓'
                                  };
                              }
                            };
                            
                            const statusInfo = getStatusInfo();
                            
                            return (
                              <div 
                                key={acc.id} 
                                className={`bg-gradient-to-br ${statusInfo.bg} rounded-[50px] p-10 shadow-2xl hover:shadow-pink-400/30 transition-all duration-300 border-5 ${statusInfo.border} transform hover:scale-105 shimmer`}
                              >
                                <div className="flex justify-between items-start mb-8">
                                  <div>
                                    <h3 className="text-4xl font-bold text-purple-700 mb-3 flex items-center gap-3">
                                      {acc.username} 
                                      <span className="wiggle">{statusInfo.emoji}</span>
                                    </h3>
                                    <p className="text-gray-700 text-2xl font-bold">{acc.profile}</p>
                                  </div>
                                  <span className={`px-7 py-4 rounded-full text-xl font-bold shadow-xl ${statusInfo.badge} pulse-soft`}>
                                    {statusInfo.badgeText}
                                  </span>
                                </div>
                                <div className="space-y-5 mb-8">
                                  <p className={`text-2xl flex items-center gap-4 font-bold ${
                                    acc.remaining === 0 ? 'text-red-600' : 'text-gray-800'
                                  }`}>
                                    <Clock size={28} className="text-purple-500 bounce-cute" />
                                    Осталось: {acc.remaining} мин
                                  </p>
                                  <p className="text-gray-800 text-2xl font-bold flex items-center gap-3">
                                    <span className="text-2xl">▶</span>
                                    Начало: {acc.startTime}
                                  </p>
                                  {acc.robloxCookie && (
                                    <p className="text-purple-600 text-xl font-bold flex items-center gap-3 sparkle-animation">
                                      🤖 Автокик включён
                                    </p>
                                  )}
                                </div>
                                
                                <div className="space-y-4">
                                  {statusInfo.showKick && (
                                    <button
                                      onClick={() => manualKickAccount(acc.id)}
                                      className="w-full py-6 bg-gradient-to-r from-orange-400 via-red-400 to-orange-500 text-white font-bold text-2xl rounded-full shadow-xl hover:shadow-orange-400/50 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-4 shimmer"
                                    >
                                      <ExternalLink size={28} />
                                      Кикнуть на Roblox
                                    </button>
                                  )}
                                  
                                  {acc.status === 'pending-kick' && (
                                    <button
                                      onClick={() => confirmKick(acc.id)}
                                      className="w-full py-6 bg-gradient-to-r from-green-400 via-emerald-400 to-green-500 text-white font-bold text-2xl rounded-full shadow-xl hover:shadow-green-400/50 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-4 shimmer"
                                    >
                                      <CheckCircle size={28} />
                                      Подтвердить кик
                                    </button>
                                  )}
                                  
                                  {(acc.status === 'kicked' || acc.status === 'expired') && (
                                    <button
                                      onClick={() => removeAccount(acc.id)}
                                      className="w-full py-6 bg-gradient-to-r from-red-400 via-pink-400 to-red-500 text-white font-bold text-2xl rounded-full shadow-xl hover:shadow-red-400/50 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-4 shimmer"
                                    >
                                      <Trash2 size={28} />
                                      Удалить из списка
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {currentTab === 'clients' && (
                  <div className="space-y-10">
                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-shadow p-12 shimmer">
                      <h2 className="text-5xl font-bold text-blue-600 mb-12 flex items-center gap-5 pacifico">
                        <span className="text-6xl sparkle-animation">👥</span>
                        <span className="gradient-text">Добавить клиента</span>
                        <span className="text-6xl wiggle">✨</span>
                      </h2>
                      <div className="space-y-7">
                        <input
                          type="text"
                          placeholder="🌟 Имя клиента"
                          value={clientName}
                          onChange={(e) => setClientName(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-blue-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-blue-50 shadow-xl text-2xl font-bold"
                        />
                        <select
                          value={clientStatus}
                          onChange={(e) => setClientStatus(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-blue-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-purple-50 shadow-xl text-2xl font-bold"
                        >
                          <option value="Bronze">🥉 Bronze</option>
                          <option value="Silver">🥈 Silver</option>
                          <option value="Gold">🥇 Gold</option>
                          <option value="Ultimate">👑 Ultimate</option>
                        </select>
                        <input
                          type="text"
                          placeholder="⏱️ Время просрочки"
                          value={clientOverdue}
                          onChange={(e) => setClientOverdue(e.target.value)}
                          className="w-full px-10 py-7 rounded-full border-4 border-blue-400 focus:border-purple-500 focus:ring-6 focus:ring-purple-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-pink-50 shadow-xl text-2xl font-bold"
                        />
                        <button
                          onClick={addClient}
                          className="w-full py-8 bg-gradient-to-r from-blue-400 via-purple-400 to-blue-500 text-white font-bold text-3xl rounded-full shadow-2xl hover:shadow-blue-400/50 transform hover:scale-105 transition-all duration-300 shimmer"
                        >
                          ✨👥 Добавить клиента 👥✨
                        </button>
                      </div>
                    </div>

                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-shadow p-12 shimmer">
                      <h2 className="text-5xl font-bold text-purple-600 mb-12 flex items-center gap-5 pacifico">
                        <Star className="text-yellow-400 sparkle-animation" fill="currentColor" size={48} />
                        <span className="gradient-text">Постоянные клиенты ({clients.length})</span>
                        <Heart className="text-pink-400 pulse-soft heart-beat" fill="currentColor" size={44} />
                      </h2>
                      {clients.length === 0 ? (
                        <div className="text-center py-24">
                          <div className="text-9xl mb-8 sparkle-animation wiggle">🌸✨👥</div>
                          <p className="text-gray-600 text-4xl font-bold gradient-text">Нет клиентов</p>
                          <p className="text-gray-500 text-xl font-semibold mt-4">Добавьте первого клиента! ☁️</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                          {clients.map(client => {
                            const statusColors = {
                              Bronze: { gradient: 'from-orange-300 via-yellow-300 to-orange-300', border: 'border-orange-500', emoji: '🥉' },
                              Silver: { gradient: 'from-gray-300 via-gray-400 to-gray-300', border: 'border-gray-600', emoji: '🥈' },
                              Gold: { gradient: 'from-yellow-300 via-yellow-500 to-yellow-300', border: 'border-yellow-600', emoji: '🥇' },
                              Ultimate: { gradient: 'from-purple-400 via-pink-400 to-purple-400', border: 'border-purple-600', emoji: '👑' }
                            };
                            const info = statusColors[client.status];
                            return (
                              <div key={client.id} className={`bg-gradient-to-br ${info.gradient} rounded-[50px] p-10 shadow-2xl hover:shadow-yellow-400/30 transition-all duration-300 border-5 ${info.border} transform hover:scale-105 shimmer`}>
                                <div className="flex justify-between items-start mb-8">
                                  <h3 className="text-4xl font-bold text-gray-900 flex items-center gap-3">
                                    {client.name} 
                                    <span className="wiggle">{info.emoji}</span>
                                  </h3>
                                  <span className="px-7 py-4 bg-white/95 rounded-full text-xl font-bold shadow-xl pulse-soft">
                                    {info.emoji} {client.status}
                                  </span>
                                </div>
                                <div className="space-y-4 mb-8">
                                  <p className="text-gray-900 text-2xl font-bold flex items-center gap-3">
                                    <span className="text-3xl">📅</span>
                                    Дата: {client.date}
                                  </p>
                                  <p className="text-gray-900 text-2xl font-bold flex items-center gap-3">
                                    <span className="text-3xl">⏱️</span>
                                    Просрочка: {client.overdue}
                                  </p>
                                </div>
                                <button
                                  onClick={() => removeClient(client.id)}
                                  className="w-full py-6 bg-gradient-to-r from-red-500 via-pink-500 to-red-600 text-white font-bold text-2xl rounded-full shadow-xl hover:shadow-red-400/50 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-3 shimmer"
                                >
                                  <Trash2 size={26} />
                                  Удалить
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {currentTab === 'calculator' && (
                  <div className="flex justify-center items-center min-h-[60vh]">
                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-glow p-14 w-full max-w-2xl shimmer">
                      <h2 className="text-6xl font-bold text-purple-600 mb-14 flex items-center justify-center gap-5 pacifico">
                        <span className="text-7xl sparkle-animation wiggle">🧮</span>
                        <span className="gradient-text">Калькулятор времени</span>
                        <span className="text-7xl sparkle-animation wiggle" style={{animationDelay: '1s'}}>✨</span>
                      </h2>
                      <div className="space-y-10">
                        <input
                          type="text"
                          placeholder="⏰ Время 1 (например: 2:30 или 150)"
                          value={calcTime1}
                          onChange={(e) => setCalcTime1(e.target.value)}
                          className="w-full px-10 py-8 rounded-full border-4 border-purple-400 focus:border-pink-500 focus:ring-6 focus:ring-pink-300 outline-none transition-all duration-300 bg-gradient-to-r from-purple-50 to-pink-50 shadow-xl text-2xl font-bold text-center"
                        />
                        <input
                          type="text"
                          placeholder="⏰ Время 2 (например: 1:45 или 105)"
                          value={calcTime2}
                          onChange={(e) => setCalcTime2(e.target.value)}
                          className="w-full px-10 py-8 rounded-full border-4 border-purple-400 focus:border-pink-500 focus:ring-6 focus:ring-pink-300 outline-none transition-all duration-300 bg-gradient-to-r from-purple-50 to-pink-50 shadow-xl text-2xl font-bold text-center"
                        />
                        
                        <div className="grid grid-cols-2 gap-8">
                          <button
                            onClick={() => calculateTime('add')}
                            className="py-8 bg-gradient-to-r from-green-400 via-emerald-400 to-green-500 text-white font-bold text-3xl rounded-full shadow-2xl hover:shadow-green-400/50 transform hover:scale-105 transition-all duration-300 shimmer"
                          >
                            ➕ Сложить
                          </button>
                          <button
                            onClick={() => calculateTime('subtract')}
                            className="py-8 bg-gradient-to-r from-red-400 via-pink-400 to-red-500 text-white font-bold text-3xl rounded-full shadow-2xl hover:shadow-red-400/50 transform hover:scale-105 transition-all duration-300 shimmer"
                          >
                            ➖ Вычесть
                          </button>
                        </div>

                        {calcResult && (
                          <div className="bg-white rounded-[50px] p-12 shadow-2xl border-5 border-pink-400 text-center success-ping">
                            <p className="text-gray-600 text-2xl font-bold mb-4">Результат:</p>
                            <p className="text-8xl font-bold rainbow-text sparkle-animation mb-4">{calcResult}</p>
                            <p className="text-gray-600 text-2xl font-bold mt-4">минут ✨</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {currentTab === 'profile' && (
                  <div className="flex justify-center items-center min-h-[60vh]">
                    <div className="kawaii-card rounded-[60px] shadow-2xl cute-glow p-14 w-full max-w-2xl text-center shimmer">
                      <div className="mb-12 sparkle-animation wiggle">
                        <span className="text-9xl">👑✨💖</span>
                      </div>
                      <h2 className="text-7xl font-bold rainbow-text mb-8 pacifico">Azim218</h2>
                      <p className="text-4xl font-bold text-gray-700 mb-4">Администратор</p>
                      <p className="text-2xl font-semibold text-purple-600 mb-10 flex items-center gap-3 justify-center">
                        <span className="text-3xl bounce-cute">☁️</span>
                        Синхронизировано между устройствами
                        <span className="text-3xl bounce-cute" style={{animationDelay: '0.5s'}}>✨</span>
                      </p>
                      
                      <div className="space-y-7 bg-gradient-to-br from-white/90 to-pink-50/90 rounded-[50px] p-12 shadow-2xl mb-10">
                        <div className="flex items-center justify-between p-7 bg-gradient-to-r from-pink-100 via-purple-100 to-pink-100 rounded-full border-3 border-pink-300 shimmer">
                          <span className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                            <span className="text-4xl bounce-cute">⏰</span>
                            Всего аккаунтов:
                          </span>
                          <span className="text-5xl font-bold gradient-text">{accounts.length}</span>
                        </div>
                        <div className="flex items-center justify-between p-7 bg-gradient-to-r from-blue-100 via-purple-100 to-blue-100 rounded-full border-3 border-blue-300 shimmer">
                          <span className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                            <span className="text-4xl bounce-cute" style={{animationDelay: '0.3s'}}>👥</span>
                            Всего клиентов:
                          </span>
                          <span className="text-5xl font-bold gradient-text">{clients.length}</span>
                        </div>
                        <div className="flex items-center justify-between p-7 bg-gradient-to-r from-purple-100 via-pink-100 to-purple-100 rounded-full border-3 border-purple-300 shimmer">
                          <span className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                            <span className="text-4xl sparkle-animation">✨</span>
                            Активных:
                          </span>
                          <span className="text-5xl font-bold gradient-text">{accounts.filter(a => a.status === 'active').length}</span>
                        </div>
                      </div>
                      
                      <div className="mb-10">
                        <label className="block text-3xl font-bold text-purple-600 mb-5 pacifico flex items-center justify-center gap-3">
                          <span className="text-4xl wiggle">⚙️</span>
                          URL сервера автокика
                          <span className="text-4xl wiggle" style={{animationDelay: '1s'}}>🔧</span>
                        </label>
                        <input
                          type="text"
                          value={serverUrl}
                          onChange={(e) => setServerUrl(e.target.value)}
                          placeholder="http://localhost:3000"
                          className="w-full px-10 py-8 rounded-full border-4 border-purple-400 focus:border-pink-500 focus:ring-6 focus:ring-pink-300 outline-none transition-all duration-300 bg-gradient-to-r from-white to-purple-50 shadow-xl text-2xl font-bold text-center"
                        />
                        <p className="text-gray-600 text-lg mt-4 font-semibold">Оставьте пустым для ручного режима ✨</p>
                      </div>
                      
                      <div className="p-10 bg-gradient-to-r from-purple-200 via-pink-200 to-purple-200 rounded-[50px] border-5 border-purple-400 shimmer">
                        <p className="text-3xl font-bold text-purple-700 mb-5 flex items-center justify-center gap-3">
                          <Heart className="text-pink-500 heart-beat" fill="currentColor" size={36} />
                          Спасибо за работу!
                          <Heart className="text-pink-500 heart-beat" fill="currentColor" size={36} style={{animationDelay: '0.5s'}} />
                        </p>
                        <p className="text-2xl font-bold text-gray-700 flex items-center justify-center gap-3">
                          <span className="text-3xl sparkle-animation">✨</span>
                          Вы делаете мир лучше!
                          <span className="text-3xl sparkle-animation" style={{animationDelay: '1s'}}>💖</span>
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.render(<RobloxManagerApp />, document.getElementById('root'));
    </script>
</body>
</html>
